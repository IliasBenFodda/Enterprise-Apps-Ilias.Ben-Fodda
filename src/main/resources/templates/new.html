<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Nieuw evenement</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-1 max-w-3xl mx-auto w-full px-4 py-10 space-y-10">

    <!-- Evenement formulier -->
    <section class="bg-white rounded-xl shadow overflow-hidden">
        <div class="bg-blue-800 px-8 py-5">
            <h1 class="text-xl font-bold text-white">Nieuw evenement aanmaken</h1>
        </div>
        <div class="px-8 py-6">
            <form th:action="@{/new/evenement}" th:method="post" th:object="${evenementForm}" class="space-y-5">

                <div>
                    <label for="titel" class="block text-sm font-semibold text-gray-700 mb-1">Titel</label>
                    <input type="text" id="titel" th:field="*{titel}"
                           class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                    <span th:if="${#fields.hasErrors('titel')}" th:errors="*{titel}"
                          class="text-red-600 text-xs mt-1 block"></span>
                </div>

                <div>
                    <label for="omschrijving"
                           class="block text-sm font-semibold text-gray-700 mb-1">Omschrijving</label>
                    <textarea id="omschrijving" th:field="*{omschrijving}" rows="4"
                              class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition resize-none"></textarea>
                    <span th:if="${#fields.hasErrors('omschrijving')}" th:errors="*{omschrijving}"
                          class="text-red-600 text-xs mt-1 block"></span>
                </div>

                <div>
                    <label for="tijdstip" class="block text-sm font-semibold text-gray-700 mb-1">Tijdstip</label>
                    <input type="datetime-local" id="tijdstip" th:field="*{tijdstip}"
                           class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                    <span th:if="${#fields.hasErrors('tijdstip')}" th:errors="*{tijdstip}"
                          class="text-red-600 text-xs mt-1 block"></span>
                </div>

                <div>
                    <label for="organisatie" class="block text-sm font-semibold text-gray-700 mb-1">Organisatie</label>
                    <input type="text" id="organisatie" th:field="*{organisatie}"
                           class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                    <span th:if="${#fields.hasErrors('organisatie')}" th:errors="*{organisatie}"
                          class="text-red-600 text-xs mt-1 block"></span>
                </div>

                <div>
                    <label for="emailContactpersoon" class="block text-sm font-semibold text-gray-700 mb-1">E-mail
                        contactpersoon</label>
                    <input type="email" id="emailContactpersoon" th:field="*{emailContactpersoon}"
                           class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                    <span th:if="${#fields.hasErrors('emailContactpersoon')}" th:errors="*{emailContactpersoon}"
                          class="text-red-600 text-xs mt-1 block"></span>
                </div>

                <div>
                    <label for="locatieId" class="block text-sm font-semibold text-gray-700 mb-1">Locatie</label>
                    <select id="locatieId" th:field="*{locatieId}"
                            class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-800 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                        <option value="">-- Kies een locatie --</option>
                        <option th:each="loc : ${locaties}"
                                th:value="${loc.id}"
                                th:text="${loc.naam}">
                        </option>
                    </select>
                    <span th:if="${#fields.hasErrors('locatieId')}" th:errors="*{locatieId}"
                          class="text-red-600 text-xs mt-1 block"></span>
                </div>

                <button type="submit"
                        class="w-full bg-blue-800 hover:bg-blue-900 text-white font-semibold py-2 rounded-md shadow transition-colors">
                    Evenement opslaan
                </button>
            </form>
        </div>
    </section>

    <!-- Locatie formulier -->
    <section class="bg-white rounded-xl shadow overflow-hidden">
        <div class="bg-red-700 px-8 py-5">
            <h2 class="text-xl font-bold text-white">Nieuwe locatie toevoegen</h2>
        </div>
        <div class="px-8 py-6">
            <form th:action="@{/new/locatie}" th:method="post" th:object="${locatie}" class="space-y-5">

                <div>
                    <label for="naam" class="block text-sm font-semibold text-gray-700 mb-1">Naam</label>
                    <input type="text" id="naam" th:field="*{naam}"
                           class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 transition">
                    <span th:if="${#fields.hasErrors('naam')}" th:errors="*{naam}"
                          class="text-red-600 text-xs mt-1 block"></span>
                </div>

                <div>
                    <label for="adres" class="block text-sm font-semibold text-gray-700 mb-1">Adres</label>
                    <input type="text" id="adres" th:field="*{adres}"
                           class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 transition">
                    <span th:if="${#fields.hasErrors('adres')}" th:errors="*{adres}"
                          class="text-red-600 text-xs mt-1 block"></span>
                </div>

                <div>
                    <label for="capaciteit" class="block text-sm font-semibold text-gray-700 mb-1">Capaciteit</label>
                    <input type="number" id="capaciteit" th:field="*{capaciteit}" min="1"
                           class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 transition">
                    <span th:if="${#fields.hasErrors('capaciteit')}" th:errors="*{capaciteit}"
                          class="text-red-600 text-xs mt-1 block"></span>
                </div>

                <button type="submit"
                        class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded-md shadow transition-colors">
                    Locatie toevoegen
                </button>
            </form>
        </div>
    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
