<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Evenement details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-1 max-w-3xl mx-auto w-full px-4 py-10">
    <a th:href="@{/}"
       class="inline-flex items-center text-blue-700 hover:text-blue-900 font-medium mb-6 transition-colors">
        ← Terug naar overzicht
    </a>

    <div class="bg-white rounded-xl shadow overflow-hidden">
        <div class="bg-blue-800 px-8 py-6">
            <h1 class="text-2xl font-bold text-white" th:text="${evenement.titel}"></h1>
            <p class="text-blue-200 mt-1 text-sm" th:text="${evenement.organisatie}"></p>
        </div>

        <div class="px-8 py-6 space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <div class="bg-gray-50 rounded-lg p-4">
                    <p class="text-xs font-semibold text-red-600 uppercase tracking-wide mb-1">Tijdstip</p>
                    <p class="text-gray-800 font-medium" th:text="${evenement.tijdstip}"></p>
                </div>

                <div class="bg-gray-50 rounded-lg p-4">
                    <p class="text-xs font-semibold text-red-600 uppercase tracking-wide mb-1">E-mail contactpersoon</p>
                    <p class="text-gray-800 font-medium" th:text="${evenement.emailContactpersoon}"></p>
                </div>

            </div>

            <div class="bg-gray-50 rounded-lg p-4">
                <p class="text-xs font-semibold text-red-600 uppercase tracking-wide mb-1">Omschrijving</p>
                <p class="text-gray-700 leading-relaxed" th:text="${evenement.omschrijving}"></p>
            </div>

            <div class="border-t border-gray-200 pt-4">
                <h2 class="text-lg font-semibold text-blue-800 mb-3">Locatie</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="bg-gray-50 rounded-lg p-4">
                        <p class="text-xs font-semibold text-red-600 uppercase tracking-wide mb-1">Naam</p>
                        <p class="text-gray-800 font-medium" th:text="${evenement.locatieNaam}"></p>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4">
                        <p class="text-xs font-semibold text-red-600 uppercase tracking-wide mb-1">Adres</p>
                        <p class="text-gray-800 font-medium" th:text="${evenement.locatieAdres}"></p>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4">
                        <p class="text-xs font-semibold text-red-600 uppercase tracking-wide mb-1">Capaciteit</p>
                        <p class="text-gray-800 font-medium" th:text="${evenement.locatieCapaciteit}"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
