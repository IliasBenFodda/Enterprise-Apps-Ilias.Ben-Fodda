<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-1 max-w-2xl mx-auto w-full px-4 py-10">
    <h1 class="text-3xl font-bold text-blue-900 mb-8">Contact</h1>

    <div class="bg-white rounded-xl shadow p-8">
        <form th:action="@{/contact}" th:method="post" th:object="${contactForm}" class="space-y-5">

            <div>
                <label for="naam" class="block text-sm font-semibold text-gray-700 mb-1">Naam</label>
                <input type="text" id="naam" th:field="*{naam}"
                       class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                <span th:if="${#fields.hasErrors('naam')}" th:errors="*{naam}"
                      class="text-red-600 text-xs mt-1 block"></span>
            </div>

            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">E-mailadres</label>
                <input type="email" id="email" th:field="*{email}"
                       class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
                      class="text-red-600 text-xs mt-1 block"></span>
            </div>

            <div>
                <label for="onderwerp" class="block text-sm font-semibold text-gray-700 mb-1">Onderwerp</label>
                <input type="text" id="onderwerp" th:field="*{onderwerp}"
                       class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                <span th:if="${#fields.hasErrors('onderwerp')}" th:errors="*{onderwerp}"
                      class="text-red-600 text-xs mt-1 block"></span>
            </div>

            <div>
                <label for="bericht" class="block text-sm font-semibold text-gray-700 mb-1">Bericht</label>
                <textarea id="bericht" th:field="*{bericht}" rows="5"
                          class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition resize-none"></textarea>
                <span th:if="${#fields.hasErrors('bericht')}" th:errors="*{bericht}"
                      class="text-red-600 text-xs mt-1 block"></span>
            </div>

            <button type="submit"
                    class="w-full bg-blue-800 hover:bg-blue-900 text-white font-semibold py-2 rounded-md shadow transition-colors">
                Verstuur bericht
            </button>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
